<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Work | Merriment</title>
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 32px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-elevated);
            aspect-ratio: 4/3;
            background: var(--secondary-bg);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gallery-item:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(29, 29, 31, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #FFFFFF;
            padding: 12px 16px;
            text-align: center;
            font-size: 15px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Merriment</h1>
            <p style="color: var(--text-secondary); margin-top: 8px;">Catholic Event Planning</p>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/about.html">About</a></li>
                    <li><a href="/gallery.html">Our Work</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <div style="max-width: 720px; margin: 0 auto 32px;">
                <h2 style="margin-bottom: 16px;">Our Work</h2>
                <p style="color: var(--text-secondary); font-size: 19px;">A glimpse into the celebrations we've helped create.</p>
            </div>

            <div class="gallery-grid">
                <!-- Placeholders -->
                <div class="gallery-item">
                    <img src="https://placehold.co/600x450/007AFF/FFF?text=Wedding+Reception" alt="Wedding Reception">
                    <div class="caption">Z Wedding</div>
                </div>
                <div class="gallery-item">
                    <img src="https://placehold.co/600x450/34C759/FFF?text=Joyous+Baptism" alt="Joyous' Baptism">
                    <div class="caption">Joyous' Baptism</div>
                </div>
                <div class="gallery-item">
                    <img src="https://placehold.co/600x450/FF9500/FFF?text=Andreas+'s+Birthday"
                        alt="Andreas' Birthday">
                    <div class="caption">Andreas' Birthday</div>
                </div>
                <div class="gallery-item">
                    <img src="https://placehold.co/600x450/FF2D55/FFF?text=Baby+Shower" alt="Baby Shower">
                    <div class="caption">Baby Shower</div>
                </div>
                <div class="gallery-item">
                    <img src="https://placehold.co/600x450/5856D6/FFF?text=Baby+Sprinkle" alt="Baby Sprinkle">
                    <div class="caption">Baby Sprinkle</div>
                </div>
                <div class="gallery-item">
                    <img src="https://placehold.co/600x450/AF52DE/FFF?text=Grandfather's+Birthday"
                        alt="Grandfather's Birthday Setup">
                    <div class="caption">Grandfather's Birthday</div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Merriment. Ad Majorem Dei Gloriam.</p>
        </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
